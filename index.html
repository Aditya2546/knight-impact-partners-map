<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knight Impact Partners - Interactive Map</title>
    
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Supabase Client for Cloud Sync -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Cloud Database Configuration (must match dashboard.html) -->
    <script>
        const SUPABASE_URL = '';  // Same as dashboard.html
        const SUPABASE_ANON_KEY = '';  // Same as dashboard.html
        
        let supabase = null;
        let cloudEnabled = false;
        
        if (SUPABASE_URL && SUPABASE_ANON_KEY) {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            cloudEnabled = true;
        }
    </script>
    
    <!-- Knight Impact Partners Data (fallback when cloud not configured) -->
    <script src="knight_data.js"></script>
    
    <!-- Chicago Neighborhood Polygons -->
    <script src="chicago_neighborhoods.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
        }
        
        .container {
            display: grid;
            grid-template-columns: 350px 1fr;
            height: 100vh;
            background: #1a1a1a;
        }
        
        .sidebar {
            background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            overflow-y: auto;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-text {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }
        
        .controls {
            margin-bottom: 30px;
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #d1d5db;
        }
        
        .control-select {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
        }
        
        .control-select option {
            background: #2a2a2a;
            color: #ffffff;
        }
        
        /* Google-style Autocomplete */
        .autocomplete-wrapper {
            position: relative;
        }
        
        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #2a2a2a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        
        .autocomplete-dropdown.show {
            display: block;
        }
        
        .autocomplete-item {
            padding: 12px 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.15s ease;
        }
        
        .autocomplete-item:last-child {
            border-bottom: none;
        }
        
        .autocomplete-item:hover,
        .autocomplete-item.highlighted {
            background: rgba(59, 130, 246, 0.2);
        }
        
        .autocomplete-item-name {
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 4px;
        }
        
        .autocomplete-item-name .match {
            color: #3b82f6;
            font-weight: 600;
        }
        
        .autocomplete-item-stats {
            font-size: 12px;
            color: #9ca3af;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .autocomplete-item-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .autocomplete-no-results {
            padding: 16px 14px;
            color: #9ca3af;
            font-size: 13px;
            text-align: center;
        }
        
        .stats {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .stats-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #ffffff;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .stat-label {
            color: #9ca3af;
        }
        
        .stat-value {
            color: #ffffff;
            font-weight: 600;
        }
        
        #map {
            height: 100vh;
            width: 100%;
        }
        
        .leaflet-popup-content-wrapper {
            background: rgba(26, 26, 26, 0.95);
            color: #ffffff;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .leaflet-popup-content {
            margin: 16px;
            font-family: 'Inter', sans-serif;
        }
        
        .leaflet-popup-tip {
            background: rgba(26, 26, 26, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .custom-tooltip {
            background: rgba(26, 26, 26, 0.9) !important;
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 8px !important;
            font-family: 'Inter', sans-serif !important;
            font-size: 12px !important;
            padding: 8px 12px !important;
        }
        
        .neighborhood-tooltip {
            background: linear-gradient(135deg, rgba(17, 17, 17, 0.98), rgba(26, 26, 26, 0.98)) !important;
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 8px !important;
            font-family: 'Inter', sans-serif !important;
            font-size: 13px !important;
            font-weight: 500 !important;
            padding: 8px 14px !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(8px) !important;
        }
        
        .neighborhood-tooltip::before {
            border-top-color: rgba(17, 17, 17, 0.98) !important;
        }
        
        .leaflet-tooltip-left.neighborhood-tooltip::before {
            border-left-color: rgba(17, 17, 17, 0.98) !important;
        }
        
        .leaflet-tooltip-right.neighborhood-tooltip::before {
            border-right-color: rgba(17, 17, 17, 0.98) !important;
        }
        
        .service-area-popup .leaflet-popup-content-wrapper {
            background: linear-gradient(135deg, rgba(17, 17, 17, 0.98), rgba(26, 26, 26, 0.98)) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 12px !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4) !important;
        }
        
        .service-area-popup .leaflet-popup-content {
            margin: 0 !important;
        }
        
        .service-area-popup .leaflet-popup-tip {
            background: rgba(17, 17, 17, 0.98) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="24" height="24" fill="white" viewBox="0 0 24 24">
                        <path d="M12 2L13.09 8.26L22 9L13.09 9.74L12 16L10.91 9.74L2 9L10.91 8.26L12 2Z"/>
                    </svg>
                </div>
                <span class="logo-text">Knight Impact Partners</span>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <label class="control-label">Search Organizations</label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="orgSearchInput" class="control-select" placeholder="Type to search..." autocomplete="off">
                        <div id="autocompleteDropdown" class="autocomplete-dropdown"></div>
                    </div>
                    <select id="organizationSelect" class="control-select" style="margin-top: 8px;">
                        <option value="">All Organizations</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Filter by City</label>
                    <select id="citySelect" class="control-select">
                        <option value="">All Cities</option>
                        <option value="chicago">Chicago (55 orgs)</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Filter by Category</label>
                    <select id="categorySelect" class="control-select">
                        <option value="">All Categories</option>
                        <option value="human services">Human Services</option>
                        <option value="community building">Community Building</option>
                        <option value="systems building">Systems Building</option>
                        <option value="education">Education</option>
                        <option value="health">Health</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Neighborhoods (77 areas)</label>
                    <select id="neighborhoodSelect" class="control-select">
                        <option value="">-- Select Neighborhood --</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Regional (5 regions)</label>
                    <select id="regionalSelect" class="control-select">
                        <option value="">-- Select Region --</option>
                        <option value="South Side">South Side</option>
                        <option value="West Side">West Side</option>
                        <option value="Suburban Cook">Suburban Cook</option>
                        <option value="Lake County">Lake County</option>
                        <option value="Evanston">Evanston</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Citywide (22 orgs)</label>
                    <select id="citywideSelect" class="control-select">
                        <option value="">-- Select Organization --</option>
                    </select>
                </div>
            </div>
            
            <div class="stats">
                <div class="stats-title">Impact Overview</div>
                <div class="stat-item">
                    <span class="stat-label">Total Grants</span>
                    <span class="stat-value">90</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Organizations</span>
                    <span class="stat-value" id="totalOrgs">60</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Total Funding</span>
                    <span class="stat-value" id="totalFunding">$17.1M</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Neighborhoods</span>
                    <span class="stat-value">77</span>
                </div>
            </div>
            
            <a href="dashboard.html" style="display: block; margin-top: 20px; padding: 12px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #9ca3af; text-decoration: none; font-size: 13px; text-align: center; transition: all 0.2s ease;" onmouseover="this.style.background='rgba(255,255,255,0.1)';this.style.color='#fff'" onmouseout="this.style.background='rgba(255,255,255,0.05)';this.style.color='#9ca3af'">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="vertical-align: middle; margin-right: 8px;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                Admin Dashboard
            </a>
        </div>
        
        <div id="map"></div>
    </div>

    <script>
        // Initialize map centered on Chicago
        let map = L.map('map', {
            center: [41.8781, -87.6298],
            zoom: 10,
            zoomControl: true,
            attributionControl: true
        });

        // Add tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        
        // Create custom panes for proper z-ordering
        // Polygons go in default overlayPane (z-index 400)
        // Markers go in custom pane with higher z-index
        map.createPane('markersPane');
        map.getPane('markersPane').style.zIndex = 650;

        // Organization data - will be populated from Excel
        let organizationData = [];
        
        // Current markers on map
        let currentMarkers = [];
        
        // City boundaries (simplified)
        const cityBoundaries = {
            chicago: {
                center: [41.8781, -87.6298],
                bounds: [[41.6444, -87.9073], [42.0718, -87.5240]]
            }
        };

        // Add city boundary rectangles (completely disabled)
        function addCityBoundaries() {
            // Completely removed - no city boundaries shown
        }

        // Add organization marker
        function addOrganizationMarker(org) {
            if (!org.lat || !org.lng) {
                console.log('Skipping org without coordinates:', org.name, 'lat:', org.lat, 'lng:', org.lng);
                return;
            }
            console.log('Creating marker for:', org.name, 'at coordinates:', org.lat, org.lng);
            
            // Color coding by category
            const categoryColors = {
                'Human Services': '#3b82f6',
                'Community Development': '#10b981',
                'Education': '#f59e0b',
                'Health': '#a855f7',
                'Health and Human Services': '#8b5cf6',
                'Systems Building': '#06b6d4',
                'Community Building': '#84cc16'
            };
            
            const markerColor = categoryColors[org.category] || '#6b7280';
            
            const marker = L.circleMarker([org.lat, org.lng], {
                radius: 10,
                fillColor: markerColor,
                color: '#ffffff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.9,
                pane: 'markersPane'  // Use custom pane to stay above polygons
            }).addTo(map);
            
            // Create clean popup content (removed: amount requested, mission, contact name)
            let popupContent = `
                <div style="font-family: 'Inter', sans-serif; min-width: 280px; max-width: 350px;">
                    <h3 style="margin: 0 0 12px 0; color: #ffffff; font-size: 16px; font-weight: 600;">${org.name}</h3>
                    <div style="font-size: 13px; line-height: 1.5; color: #d1d5db;">
                        <div style="margin-bottom: 6px;"><strong>📍 Location:</strong> ${org.location_note ? org.location_note + ', ' : ''}${org.city}${org.state ? ', ' + org.state : ''}</div>
                        <div style="margin-bottom: 6px;"><strong>🏷️ Category:</strong> ${org.category || 'Not specified'}</div>
            `;
            
            // Handle multiple grants
            if (org.has_multiple_grants && org.grants && org.grants.length > 1) {
                popupContent += `
                        <div style="margin-bottom: 6px;"><strong>💰 Total Grants:</strong> $${Number(org.grant_amount_awarded).toLocaleString()} (${org.grant_count} grants)</div>
                        <div style="margin-top: 10px; padding: 8px; background: rgba(59, 130, 246, 0.1); border-radius: 6px;">
                `;
                org.grants.forEach(grant => {
                    popupContent += `
                            <div style="margin-bottom: 4px; font-size: 12px;">
                                <strong>Grant ${grant.number}:</strong> $${Number(grant.amount_awarded).toLocaleString()}
                                ${grant.category ? ` - ${grant.category}` : ''}
                            </div>
                    `;
                });
                popupContent += `</div>`;
            } else {
                // Single grant
                if (org.grant_amount_awarded) {
                    popupContent += `<div style="margin-bottom: 6px;"><strong>💰 Grant Awarded:</strong> $${Number(org.grant_amount_awarded).toLocaleString()}</div>`;
                }
            }
            
            popupContent += `
                        ${org.full_time_staff ? `<div style="margin-bottom: 6px;"><strong>👥 Staff:</strong> ${org.full_time_staff} full-time${org.part_time_staff ? `, ${org.part_time_staff} part-time` : ''}</div>` : ''}
                        ${org.primary_neighborhood ? `<div style="margin-bottom: 6px;"><strong>🏘️ Primary Area:</strong> ${org.primary_neighborhood}</div>` : ''}
                        ${org.service_areas_type ? `<div style="margin-bottom: 6px;"><strong>🗺️ Service Areas:</strong> ${org.service_areas_type} (${org.service_areas_count || 0} neighborhoods)</div>` : ''}
                    </div>
                </div>
            `;
            
            marker.bindPopup(popupContent);
            marker.bindTooltip(`${org.name}<br/>${org.category}`, {
                permanent: false,
                direction: 'top',
                className: 'custom-tooltip'
            });
            
            // When popup opens, show service areas
            marker.on('popupopen', function() {
                drawServiceAreas(org);
            });
            
            // When popup closes, clear service areas
            marker.on('popupclose', function() {
                clearServiceAreas();
            });
            
            currentMarkers.push(marker);
        }

        // Store service area polygons
        let serviceAreaPolygons = [];

        // Clear service area polygons
        function clearServiceAreas() {
            serviceAreaPolygons.forEach(polygon => map.removeLayer(polygon));
            serviceAreaPolygons = [];
        }

        // Bring all markers to front (above polygons)
        function bringMarkersToFront() {
            currentMarkers.forEach(marker => {
                if (marker.bringToFront) {
                    marker.bringToFront();
                }
            });
        }
        
        // Show all 77 Chicago neighborhoods
        function showAllNeighborhoods() {
            clearServiceAreas();
            
            if (typeof CHICAGO_NEIGHBORHOODS === 'undefined') return;
            
            // Category colors for visual variety
            const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#84cc16', '#ec4899'];
            let colorIndex = 0;
            
            Object.keys(CHICAGO_NEIGHBORHOODS).forEach(key => {
                const coords = CHICAGO_NEIGHBORHOODS[key];
                const color = colors[colorIndex % colors.length];
                colorIndex++;
                
                const polygon = L.polygon(coords, {
                    color: '#ffffff',
                    weight: 1,
                    opacity: 0.8,
                    fillColor: color,
                    fillOpacity: 0.3
                }).addTo(map);
                
                // Convert key to display name
                const displayName = key.split('_').map(word => 
                    word.charAt(0).toUpperCase() + word.slice(1)
                ).join(' ');
                
                // Count orgs serving this area
                const orgsInArea = organizationData.filter(org => 
                    org.service_areas && org.service_areas.some(area => 
                        area.toLowerCase().replace(/ /g, '_') === key
                    )
                );
                
                // Add tooltip
                polygon.bindTooltip(`${displayName}<br><span style="color: #22c55e;">${orgsInArea.length} orgs</span>`, {
                    permanent: false,
                    direction: 'center',
                    className: 'neighborhood-tooltip'
                });
                
                // Add hover effects
                polygon.on('mouseover', function(e) {
                    this.setStyle({
                        weight: 2,
                        fillOpacity: 0.5
                    });
                });
                
                polygon.on('mouseout', function(e) {
                    this.setStyle({
                        weight: 1,
                        fillOpacity: 0.3
                    });
                });
                
                // Click to show orgs in this area
                polygon.on('click', function(e) {
                    if (orgsInArea.length > 0) {
                        let popupContent = `
                            <div style="font-family: 'Inter', sans-serif; padding: 12px; min-width: 250px; max-height: 300px; overflow-y: auto;">
                                <h3 style="margin: 0 0 8px 0; color: #ffffff; font-size: 14px;">${displayName}</h3>
                                <div style="font-size: 12px; color: #a1a1aa; margin-bottom: 8px;">${orgsInArea.length} organizations</div>
                        `;
                        orgsInArea.forEach(org => {
                            popupContent += `<div style="padding: 4px 0; border-top: 1px solid rgba(255,255,255,0.1); font-size: 12px; color: #d4d4d8;">${org.name}</div>`;
                        });
                        popupContent += '</div>';
                        
                        L.popup()
                            .setLatLng(e.latlng)
                            .setContent(popupContent)
                            .openOn(map);
                    }
                });
                
                serviceAreaPolygons.push(polygon);
            });
            
            // Zoom to Chicago
            map.setView([41.8781, -87.6298], 10);
        }
        
        // Highlight a service area and show orgs popup
        function highlightServiceArea(areaName, orgsInArea) {
            clearServiceAreas();
            
            if (typeof CHICAGO_NEIGHBORHOODS === 'undefined') {
                console.log('CHICAGO_NEIGHBORHOODS not loaded');
                return;
            }
            
            // areaName is already in snake_case from dropdown value
            const key = areaName;
            
            // Check if this is a region that contains multiple community areas
            let areasToHighlight = [];
            if (typeof REGION_COMMUNITY_AREAS !== 'undefined' && REGION_COMMUNITY_AREAS[key]) {
                // This is a region - get all community areas
                areasToHighlight = REGION_COMMUNITY_AREAS[key];
            } else if (CHICAGO_NEIGHBORHOODS[key]) {
                // Single neighborhood
                areasToHighlight = [key];
            } else {
                console.log('No coordinates found for:', key);
                return;
            }
            
            // Convert snake_case to display name
            const displayName = areaName.split('_').map(word => 
                word.charAt(0).toUpperCase() + word.slice(1)
            ).join(' ');
            
            // Build popup content with list of orgs (same for all polygons)
            let popupContent = `
                <div style="font-family: 'Inter', sans-serif; padding: 12px; min-width: 280px; max-height: 400px; overflow-y: auto;">
                    <h3 style="margin: 0 0 12px 0; color: #ffffff; font-size: 16px; font-weight: 600;">
                        📍 ${displayName}
                    </h3>
                    <div style="font-size: 13px; color: #a1a1aa; margin-bottom: 12px;">
                        ${orgsInArea.length} organization${orgsInArea.length !== 1 ? 's' : ''} serving this area
                    </div>
                    <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px;">
            `;
            
            orgsInArea.forEach((org, index) => {
                const funding = org.grant_amount_awarded ? `$${Number(org.grant_amount_awarded).toLocaleString()}` : 'N/A';
                popupContent += `
                    <div style="padding: 8px 0; ${index > 0 ? 'border-top: 1px solid rgba(255,255,255,0.05);' : ''}">
                        <div style="font-weight: 600; color: #ffffff; margin-bottom: 4px;">${org.name}</div>
                        <div style="font-size: 12px; color: #a1a1aa;">
                            <span style="color: #22c55e;">${funding}</span> • ${org.category || 'N/A'}
                        </div>
                    </div>
                `;
            });
            
            popupContent += `</div></div>`;
            
            // Track bounds for all polygons
            let allBounds = null;
            let firstPolygon = null;
            
            // Draw all polygons for this region/neighborhood
            areasToHighlight.forEach(area => {
                let polygonCoords;
                
                // Special handling for suburban_cook - draw as donut with Chicago hole
                if (area === 'suburban_cook' && typeof SUBURBAN_COOK_POLYGON !== 'undefined') {
                    // Leaflet polygon with hole: [outerRing, holeRing]
                    polygonCoords = [SUBURBAN_COOK_POLYGON.outer, SUBURBAN_COOK_POLYGON.hole];
                } else {
                    const coords = CHICAGO_NEIGHBORHOODS[area];
                    if (!coords) return;
                    polygonCoords = coords;
                }
                
                const polygon = L.polygon(polygonCoords, {
                    color: '#f59e0b',
                    weight: 2,
                    opacity: 1,
                    fillColor: '#f59e0b',
                    fillOpacity: 0.3
                }).addTo(map);
                
                // Bind popup to each polygon
                polygon.bindPopup(popupContent, {
                    maxWidth: 350,
                    className: 'service-area-popup'
                });
                
                // Expand bounds
                if (!allBounds) {
                    allBounds = polygon.getBounds();
                    firstPolygon = polygon;
                } else {
                    allBounds.extend(polygon.getBounds());
                }
                
                serviceAreaPolygons.push(polygon);
            });
            
            // Open popup on first polygon
            if (firstPolygon) {
                firstPolygon.openPopup();
            }
            
            // Zoom to fit all polygons
            if (allBounds) {
                map.fitBounds(allBounds.pad(0.1));
            }
            
            bringMarkersToFront();
        }

        // Draw service area polygons for an organization
        function drawServiceAreas(org) {
            clearServiceAreas();
            
            if (!org.service_areas || org.service_areas.length === 0) {
                return;
            }
            
            if (typeof CHICAGO_NEIGHBORHOODS === 'undefined') {
                console.log('ERROR: CHICAGO_NEIGHBORHOODS not loaded');
                return;
            }
            
            // Color based on category
            const categoryColors = {
                'Human Services': '#3b82f6',
                'Community Building': '#84cc16',
                'Education': '#f59e0b',
                'Health': '#a855f7',
                'Community Building, Health, Human Services, Education': '#a855f7'
            };
            const color = categoryColors[org.category] || '#3b82f6';
            
            // Neighborhood aliases - mapping common names to official 77 community area names
            const neighborhoodAliases = {
                // Common alternate names
                'near_northside': 'near_north_side',
                'near_westside': 'near_west_side',
                'near_southside': 'near_south_side',
                'lakeview': 'lake_view',
                'o_hare': 'ohare',
                // Sub-neighborhoods mapped to their community areas
                'little_village': 'south_lawndale',
                'pilsen': 'lower_west_side',
                'bronzeville': 'douglas',
                'grand_crossing': 'greater_grand_crossing',
                'garfield_park': 'west_garfield_park',
                'back_of_the_yards': 'new_city',
                'chinatown': 'armour_square',
                'andersonville': 'edgewater',
                'wrigleyville': 'lake_view',
                'boystown': 'lake_view',
                'old_town': 'near_north_side',
                'gold_coast': 'near_north_side',
                'river_north': 'near_north_side',
                'streeterville': 'near_north_side',
                'west_loop': 'near_west_side',
                'greektown': 'near_west_side',
                'bucktown': 'logan_square',
                'wicker_park': 'west_town',
                'ukrainian_village': 'west_town'
            };
            
            org.service_areas.forEach(areaName => {
                // Convert area name to key format (lowercase, underscores)
                let cleanName = areaName.toLowerCase()
                    .replace(/['']/g, '')
                    .replace(/[^a-z0-9]/g, '_')
                    .replace(/_+/g, '_')
                    .replace(/^_|_$/g, '');
                
                // Check aliases first
                if (neighborhoodAliases[cleanName]) {
                    cleanName = neighborhoodAliases[cleanName];
                }
                
                // Try different variations
                const variations = [
                    cleanName,
                    cleanName.replace(/_/g, ''),
                    areaName.toLowerCase().replace(/ /g, '_'),
                    areaName.toLowerCase().replace(/[ -]/g, '_'),
                    neighborhoodAliases[areaName.toLowerCase().replace(/ /g, '_')] || null
                ].filter(Boolean);
                
                let coords = null;
                for (const key of variations) {
                    if (CHICAGO_NEIGHBORHOODS[key]) {
                        coords = CHICAGO_NEIGHBORHOODS[key];
                        break;
                    }
                }
                
                if (coords) {
                    const polygon = L.polygon(coords, {
                        color: '#ffffff',
                        weight: 2,
                        opacity: 0.9,
                        fillColor: color,
                        fillOpacity: 0.35
                    }).addTo(map);
                    
                    // Convert snake_case to display name for tooltip
                    const displayName = areaName.split('_').map(word => 
                        word.charAt(0).toUpperCase() + word.slice(1)
                    ).join(' ');
                    
                    // Add tooltip with neighborhood name on hover
                    polygon.bindTooltip(displayName, {
                        permanent: false,
                        direction: 'center',
                        className: 'neighborhood-tooltip',
                        opacity: 1
                    });
                    
                    // Add hover effects
                    polygon.on('mouseover', function(e) {
                        this.setStyle({
                            weight: 3,
                            fillOpacity: 0.55,
                            color: '#ffffff'
                        });
                        this.bringToFront();
                    });
                    
                    polygon.on('mouseout', function(e) {
                        this.setStyle({
                            weight: 2,
                            fillOpacity: 0.35,
                            color: '#ffffff'
                        });
                    });
                    
                    serviceAreaPolygons.push(polygon);
                }
            });
            
            // Ensure markers stay above polygons
            bringMarkersToFront();
        }

        // Clear all markers
        function clearMarkers() {
            currentMarkers.forEach(marker => map.removeLayer(marker));
            clearServiceAreas();
            currentMarkers = [];
        }

        // Filter and display organizations
        function filterOrganizations() {
            const selectedOrg = document.getElementById('organizationSelect').value;
            const selectedCity = document.getElementById('citySelect').value;
            const selectedCategory = document.getElementById('categorySelect').value;
            const selectedNeighborhood = document.getElementById('neighborhoodSelect').value;
            const selectedRegion = document.getElementById('regionalSelect').value;
            const selectedCitywideOrg = document.getElementById('citywideSelect').value;
            
            clearMarkers();
            clearServiceAreas();
            
            let filteredOrgs = organizationData;
            
            // Filter by specific organization (from org dropdown or citywide dropdown)
            if (selectedOrg) {
                filteredOrgs = filteredOrgs.filter(org => org.id === selectedOrg);
            } else if (selectedCitywideOrg) {
                filteredOrgs = filteredOrgs.filter(org => org.id === selectedCitywideOrg);
            }
            
            // Filter by neighborhood (using service_areas)
            if (selectedNeighborhood) {
                filteredOrgs = filteredOrgs.filter(org => 
                    org.service_areas && org.service_areas.includes(selectedNeighborhood)
                );
            }
            
            // Filter by region
            if (selectedRegion) {
                const regionKey = selectedRegion.toLowerCase().replace(/ /g, '_');
                
                // Get community areas for this region (if defined)
                const regionAreas = (typeof REGION_COMMUNITY_AREAS !== 'undefined') 
                    ? REGION_COMMUNITY_AREAS[regionKey] 
                    : null;
                
                filteredOrgs = filteredOrgs.filter(org => {
                    // Check by service_areas_type
                    const stype = org.service_areas_type || '';
                    
                    if (selectedRegion === 'Evanston') {
                        return stype.includes('Evanston') || 
                               (org.service_areas && org.service_areas.includes('evanston'));
                    }
                    if (selectedRegion === 'Suburban Cook') {
                        // Orgs serving Evanston or mixed areas serve Suburban Cook
                        return stype.includes('Evanston');
                    }
                    if (selectedRegion === 'Lake County') {
                        // Erie Family Health serves Lake County (Evanston Mixed)
                        return stype === 'Evanston Mixed';
                    }
                    if (selectedRegion === 'South Side' || selectedRegion === 'West Side') {
                        // Check if org's service_areas overlap with region's community areas
                        if (regionAreas && org.service_areas) {
                            return org.service_areas.some(area => regionAreas.includes(area));
                        }
                        // Also include South West Sides orgs for both
                        if (stype === 'South West Sides') return true;
                    }
                    return false;
                });
            }
            
            // Filter by city
            if (selectedCity) {
                filteredOrgs = filteredOrgs.filter(org => org.city_category === selectedCity);
            }
            
            // Filter by category
            if (selectedCategory) {
                filteredOrgs = filteredOrgs.filter(org => 
                    org.category && org.category.toLowerCase().includes(selectedCategory.toLowerCase())
                );
            }
            
            // Add markers for filtered organizations (unless neighborhood/region selected - show polygon instead)
            if (!selectedNeighborhood && !selectedRegion) {
                filteredOrgs.forEach(org => {
                    addOrganizationMarker(org);
                });
            }
            
            // If a single organization is selected, draw its service areas
            if ((selectedOrg || selectedCitywideOrg) && filteredOrgs.length === 1) {
                const org = filteredOrgs[0];
                drawServiceAreas(org);
            }
            
            // If neighborhood is selected, highlight it and show orgs popup on hover
            if (selectedNeighborhood && !selectedOrg && !selectedCitywideOrg) {
                highlightServiceArea(selectedNeighborhood, filteredOrgs);
            }
            
            // If region is selected, highlight it and show orgs popup
            if (selectedRegion && !selectedOrg && !selectedCitywideOrg) {
                // Convert region name to snake_case for polygon lookup
                const regionKey = selectedRegion.toLowerCase().replace(/ /g, '_');
                highlightServiceArea(regionKey, filteredOrgs);
            }
            
            // Update stats
            updateStats(filteredOrgs);
            
            // Auto-zoom based on filter selection
            if (selectedCity === 'chicago') {
                map.setView([41.8781, -87.6298], 10);
            } else if ((selectedOrg || selectedCitywideOrg) && filteredOrgs.length === 1) {
                const org = filteredOrgs[0];
                map.setView([41.8781, -87.6298], 11);
            } else if (selectedNeighborhood) {
                // Zoom handled by highlightServiceArea
            } else if (selectedRegion) {
                // Zoom handled by highlightServiceArea
            } else if (currentMarkers.length > 0) {
                const group = new L.featureGroup(currentMarkers);
                map.fitBounds(group.getBounds().pad(0.1));
            }
        }

        // Update statistics
        function updateStats(orgs) {
            const totalOrgsEl = document.getElementById('totalOrgs');
            const totalFundingEl = document.getElementById('totalFunding');
            
            if (totalOrgsEl) {
                totalOrgsEl.textContent = orgs.length;
            }
            
            const totalAwarded = orgs.reduce((sum, org) => sum + (Number(org.grant_amount_awarded) || 0), 0);
            if (totalFundingEl) {
                // Format as millions if over 1M
                if (totalAwarded >= 1000000) {
                    totalFundingEl.textContent = `$${(totalAwarded / 1000000).toFixed(1)}M`;
                } else {
                    totalFundingEl.textContent = `$${totalAwarded.toLocaleString()}`;
                }
            }
        }

        // Populate dropdowns
        function populateDropdowns() {
            const orgSelect = document.getElementById('organizationSelect');
            const neighborhoodSelect = document.getElementById('neighborhoodSelect');
            const citywideSelect = document.getElementById('citywideSelect');
            
            // Clear existing options
            orgSelect.innerHTML = '<option value="">All Organizations</option>';
            neighborhoodSelect.innerHTML = '<option value="">-- Select Neighborhood --</option>';
            citywideSelect.innerHTML = '<option value="">-- Select Organization --</option>';
            
            // Populate organization dropdown
            organizationData.forEach(org => {
                const option = document.createElement('option');
                option.value = org.id;
                option.textContent = org.name;
                orgSelect.appendChild(option);
            });
            
            // Populate neighborhoods dropdown using service_areas (like old Service Area filter)
            const allServiceAreas = new Set();
            organizationData.forEach(org => {
                if (org.service_areas) {
                    org.service_areas.forEach(area => allServiceAreas.add(area));
                }
            });
            // Sort and format display names (snake_case to Title Case)
            [...allServiceAreas].sort().forEach(area => {
                const option = document.createElement('option');
                option.value = area;
                // Convert snake_case to Title Case
                const displayName = area.split('_').map(word => 
                    word.charAt(0).toUpperCase() + word.slice(1)
                ).join(' ');
                option.textContent = displayName;
                neighborhoodSelect.appendChild(option);
            });
            
            // Populate citywide dropdown (orgs with service_areas_type = 'City Wide' or 'State Wide')
            organizationData
                .filter(org => org.service_areas_type === 'City Wide' || org.service_areas_type === 'State Wide')
                .sort((a, b) => a.name.localeCompare(b.name))
                .forEach(org => {
                    const option = document.createElement('option');
                    option.value = org.id;
                    option.textContent = org.name;
                    citywideSelect.appendChild(option);
                });
        }

        // Load organization data
        function loadOrganizationData(data) {
            console.log('Loading organization data:', data.length, 'organizations');
            organizationData = data;
            populateDropdowns();
            filterOrganizations();
        }

        // Helper to clear other filter dropdowns when one is selected
        function clearOtherFilters(exceptId) {
            const filterIds = ['organizationSelect', 'neighborhoodSelect', 'regionalSelect', 'citywideSelect', 'categorySelect'];
            filterIds.forEach(id => {
                if (id !== exceptId) {
                    document.getElementById(id).value = '';
                }
            });
            // Also clear search input and autocomplete if not selecting from org dropdown
            if (exceptId !== 'organizationSelect') {
                document.getElementById('orgSearchInput').value = '';
                document.getElementById('autocompleteDropdown').classList.remove('show');
                document.getElementById('autocompleteDropdown').innerHTML = '';
                // Repopulate full org list
                const orgSelect = document.getElementById('organizationSelect');
                orgSelect.innerHTML = '<option value="">All Organizations</option>';
                organizationData.forEach(org => {
                    const option = document.createElement('option');
                    option.value = org.id;
                    option.textContent = org.name;
                    orgSelect.appendChild(option);
                });
            }
        }
        
        // Google-style Autocomplete functionality
        const searchInput = document.getElementById('orgSearchInput');
        const autocompleteDropdown = document.getElementById('autocompleteDropdown');
        let highlightedIndex = -1;
        
        function highlightMatch(text, searchTerm) {
            if (!searchTerm) return text;
            const regex = new RegExp(`(${searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<span class="match">$1</span>');
        }
        
        function formatServiceAreas(org) {
            if (org.service_areas_type === 'City Wide') return 'Citywide';
            if (org.service_areas_type === 'State Wide') return 'Statewide';
            if (org.service_areas && org.service_areas.length > 0) {
                const count = org.service_areas.length;
                return count === 1 ? '1 area' : `${count} areas`;
            }
            return '';
        }
        
        function updateAutocomplete() {
            const searchTerm = searchInput.value.trim();
            const searchTermLower = searchTerm.toLowerCase();
            
            if (!searchTerm) {
                autocompleteDropdown.classList.remove('show');
                autocompleteDropdown.innerHTML = '';
                highlightedIndex = -1;
                return;
            }
            
            // Find matching organizations
            const matches = organizationData.filter(org => 
                org.name.toLowerCase().includes(searchTermLower)
            ).slice(0, 8); // Limit to 8 results
            
            if (matches.length === 0) {
                autocompleteDropdown.innerHTML = '<div class="autocomplete-no-results">No organizations found</div>';
                autocompleteDropdown.classList.add('show');
                highlightedIndex = -1;
                return;
            }
            
            autocompleteDropdown.innerHTML = matches.map((org, index) => {
                const serviceInfo = formatServiceAreas(org);
                const category = org.category || '';
                
                return `
                    <div class="autocomplete-item" data-id="${org.id}" data-index="${index}">
                        <div class="autocomplete-item-name">${highlightMatch(org.name, searchTerm)}</div>
                        <div class="autocomplete-item-stats">
                            ${category ? `<span>📁 ${category}</span>` : ''}
                            ${serviceInfo ? `<span>📍 ${serviceInfo}</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
            
            autocompleteDropdown.classList.add('show');
            highlightedIndex = -1;
            
            // Add click handlers
            autocompleteDropdown.querySelectorAll('.autocomplete-item').forEach(item => {
                item.addEventListener('click', function() {
                    selectOrganization(this.dataset.id);
                });
            });
        }
        
        function selectOrganization(orgId) {
            const org = organizationData.find(o => o.id === orgId);
            if (!org) return;
            
            searchInput.value = org.name;
            autocompleteDropdown.classList.remove('show');
            highlightedIndex = -1;
            
            // Select in dropdown
            const orgSelect = document.getElementById('organizationSelect');
            orgSelect.innerHTML = '<option value="">All Organizations</option>';
            organizationData.forEach(o => {
                const option = document.createElement('option');
                option.value = o.id;
                option.textContent = o.name;
                if (o.id === orgId) option.selected = true;
                orgSelect.appendChild(option);
            });
            
            clearOtherFilters('organizationSelect');
            filterOrganizations();
        }
        
        function updateHighlight() {
            const items = autocompleteDropdown.querySelectorAll('.autocomplete-item');
            items.forEach((item, index) => {
                item.classList.toggle('highlighted', index === highlightedIndex);
            });
            
            // Scroll highlighted item into view
            if (highlightedIndex >= 0 && items[highlightedIndex]) {
                items[highlightedIndex].scrollIntoView({ block: 'nearest' });
            }
        }
        
        searchInput.addEventListener('input', updateAutocomplete);
        
        searchInput.addEventListener('keydown', function(e) {
            const items = autocompleteDropdown.querySelectorAll('.autocomplete-item');
            
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (items.length > 0) {
                    highlightedIndex = Math.min(highlightedIndex + 1, items.length - 1);
                    updateHighlight();
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (items.length > 0) {
                    highlightedIndex = Math.max(highlightedIndex - 1, 0);
                    updateHighlight();
                }
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (highlightedIndex >= 0 && items[highlightedIndex]) {
                    selectOrganization(items[highlightedIndex].dataset.id);
                }
            } else if (e.key === 'Escape') {
                autocompleteDropdown.classList.remove('show');
                highlightedIndex = -1;
            }
        });
        
        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            if (!searchInput.contains(e.target) && !autocompleteDropdown.contains(e.target)) {
                autocompleteDropdown.classList.remove('show');
                highlightedIndex = -1;
            }
        });
        
        // Show dropdown on focus if there's text
        searchInput.addEventListener('focus', function() {
            if (this.value.trim()) {
                updateAutocomplete();
            }
        });
        
        // Clear search when dropdown changes
        document.getElementById('organizationSelect').addEventListener('change', function() {
            if (this.value) {
                clearOtherFilters('organizationSelect');
            }
            filterOrganizations();
        });
        document.getElementById('citySelect').addEventListener('change', filterOrganizations);
        document.getElementById('categorySelect').addEventListener('change', function() {
            if (this.value) {
                clearOtherFilters('categorySelect');
            }
            filterOrganizations();
        });
        document.getElementById('neighborhoodSelect').addEventListener('change', function() {
            if (this.value) {
                clearOtherFilters('neighborhoodSelect');
            }
            filterOrganizations();
        });
        document.getElementById('regionalSelect').addEventListener('change', function() {
            if (this.value) {
                clearOtherFilters('regionalSelect');
            }
            filterOrganizations();
        });
        document.getElementById('citywideSelect').addEventListener('change', function() {
            if (this.value) {
                clearOtherFilters('citywideSelect');
            }
            filterOrganizations();
        });

        // Initialize
        addCityBoundaries();
        
        // Load organization data - try cloud first, then fall back to local file
        async function initializeData() {
            if (cloudEnabled) {
                console.log('Cloud sync enabled, loading from database...');
                try {
                    const { data, error } = await supabase
                        .from('organizations')
                        .select('data')
                        .eq('id', 1)
                        .single();
                    
                    if (!error && data?.data && data.data.length > 0) {
                        console.log('Loaded from cloud:', data.data.length, 'organizations');
                        loadOrganizationData(data.data);
                        return;
                    }
                } catch (e) {
                    console.error('Cloud load failed:', e);
                }
            }
            
            // Fall back to local file
            console.log('Loading from local file...');
            if (typeof KNIGHT_ORGANIZATIONS_DATA_COMBINED !== 'undefined') {
                console.log('Found combined data with', KNIGHT_ORGANIZATIONS_DATA_COMBINED.length, 'organizations');
                loadOrganizationData(KNIGHT_ORGANIZATIONS_DATA_COMBINED);
            } else if (typeof KNIGHT_ORGANIZATIONS_DATA !== 'undefined') {
                console.log('Found embedded data with', KNIGHT_ORGANIZATIONS_DATA.length, 'organizations');
                loadOrganizationData(KNIGHT_ORGANIZATIONS_DATA);
            } else {
                console.error('Organization data not found!');
                loadOrganizationData([]);
            }
        }
        
        initializeData();
    </script>
</body>
</html>

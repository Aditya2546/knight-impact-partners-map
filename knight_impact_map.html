            position: fixed;

            right: 0;

            transform: translateX(100%);

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <!-- Logo -->
            <div class="logo">
                <div class="logo-icon"></div>
                <span class="logo-text">Knight Impact Partners</span>
            </div>
            
            <!-- Search Section -->
            <div class="section">
                <div class="section-label">Search Organizations</div>
                <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Type to search organizations..."
                        oninput="showSearchResults()"
                        onfocus="showSearchResults()"
                        onblur="hideSearchResults()"
                        onkeydown="handleSearchKeydown(event)"
                >
                    <div id="searchResults" class="search-results" style="display: none;">
                        <!-- Search results will appear here -->
                    </div>
                </div>
            </div>
            
            <!-- Organization Selector -->
            <div class="section">
                <div class="section-label">Select Organization</div>
                <select id="orgSelector" class="select" onchange="highlightOrg()">
                    <option value="">Choose organization to see service areas</option>
                </select>
            </div>
            
            <!-- Analytics Views -->
            <div class="section">
                <div class="section-label">Analytics Views</div>
                <button class="analytics-button" onclick="showAnalytics('funding')">
                    💰 Funding by Neighborhood
                </button>
                <button class="analytics-button" onclick="showAnalytics('overlap')">
                    🏢 Organization Overlap
                </button>
                <button class="analytics-button" onclick="showAnalytics('gaps')">
                    ❌ Service Gaps
                </button>
                <button class="analytics-button" onclick="showUnmappedOrganizations()">
                    📍 Unmapped Organizations
                </button>
                <button class="analytics-button" onclick="clearAnalytics()">
                    🔄 Clear Analytics
                </button>
            </div>
            
            <!-- Current Metrics -->
            <div class="section">
                <div class="section-label">Corrected Metrics</div>
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-value">$8.98M</div>
                        <div class="metric-label">Funding</div>

                    <div class="metric-card">
                        <div class="metric-value">278K</div>
                        <div class="metric-label">People</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">83</div>
                        <div class="metric-label">Orgs</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">79</div>
                        <div class="metric-label">Grants</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Map Container -->
        <div class="map-container">
            <div id="map"></div>
        </div>
        
        <!-- Right Sidebar for Analytics and Unmapped Organizations -->
        <div class="right-sidebar" id="rightSidebar">
            <div class="logo">
                <div class="logo-icon"></div>
                <span class="logo-text" id="sidebarTitle">Organizations</span>
            </div>
            
            <div class="section">
                <div class="section-label" id="sidebarSectionLabel">Organizations in Selected Areas</div>
                <div id="sidebarOrgsList">

            </div>
            
            <div class="section">
                <button class="analytics-button" onclick="toggleRightSidebar()">
                    ❌ Close Panel
                </button>
            </div>
        </div>
    </div>

        function showSearchResults() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const resultsContainer = document.getElementById('searchResults');
            
            if (searchTerm.length === 0) {
                resultsContainer.style.display = 'none';
                selectedResultIndex = -1;
                return;
            }
            
            // Reset selected index for new search
            selectedResultIndex = -1;
            
            // Find matching organizations
            const matchingOrgs = [];
            Object.entries(chicagoOrgData).forEach(([orgName, data]) => {
                if (orgName.toLowerCase().includes(searchTerm)) {
                    const neighborhoods = data.neighborhoods || [];
                    
                    // Determine geographic location
                    let location = 'Chicago';
                    if (neighborhoods.some(n => 
                        ['Boston', 'Cambridge', 'Worcester', 'Springfield', 'Lowell', 'Lynn', 'Lawrence', 'Brockton', 'Brookline'].includes(n)
                    )) {
                        location = 'Massachusetts';
                    } else if (neighborhoods.some(n => 
                        ['International', 'National'].includes(n) || orgName.includes('Mississippi')
                    )) {
                        location = 'Other';
                    }
                    
                    matchingOrgs.push({
                        name: orgName,
                        category: data.focus,
                        funding: data.funding,
                        people: data.students,
                        location: location
                    });
                }
            });
            
            // Sort by relevance (exact matches first, then alphabetical)
            matchingOrgs.sort((a, b) => {
                const aStartsWith = a.name.toLowerCase().startsWith(searchTerm);
                const bStartsWith = b.name.toLowerCase().startsWith(searchTerm);
                
                if (aStartsWith && !bStartsWith) return -1;
                if (!aStartsWith && bStartsWith) return 1;
                
                return a.name.localeCompare(b.name);
            });
            
            // Limit to top 8 results
            const topResults = matchingOrgs.slice(0, 8);
            
            if (topResults.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="search-result-item" style="text-align: center; color: #71717a; font-style: italic;">
                        No organizations found
                    </div>
                `;
            } else {
                resultsContainer.innerHTML = topResults.map(org => {
                    const categoryClass = org.category.toLowerCase().replace(/[^a-z]/g, '-');
                    const locationColor = org.location === 'Massachusetts' ? '#10b981' : org.location === 'Other' ? '#f59e0b' : '#3b82f6';
                    return `
                        <div class="search-result-item" onclick="selectOrganization('${org.name}')" onmousedown="event.preventDefault();">
                            <div class="search-result-name">${org.name}</div>
                            <div class="search-result-category">
                                <span style="color: ${locationColor}; font-size: 10px; font-weight: 600; margin-right: 8px;">📍 ${org.location}</span>
                                <span class="category-badge ${categoryClass}" style="font-size: 10px; padding: 2px 6px; margin-right: 8px;">${org.category}</span>
                                ${org.funding} • ${org.people} people impacted
                            </div>
                        </div>
                    `;
                }).join('');
            }
            
            resultsContainer.style.display = 'block';
        }

        function handleSearchKeydown(event) {
            const resultsContainer = document.getElementById('searchResults');
            const resultItems = resultsContainer.querySelectorAll('.search-result-item');
            
            if (resultsContainer.style.display === 'none' || resultItems.length === 0) {
                return;
            }
            
            switch(event.key) {
                case 'ArrowDown':
                    event.preventDefault();
                    selectedResultIndex = Math.min(selectedResultIndex + 1, resultItems.length - 1);
                    updateSelectedResult(resultItems);
                    break;
                    
                case 'ArrowUp':
                    event.preventDefault();
                    selectedResultIndex = Math.max(selectedResultIndex - 1, 0);
                    updateSelectedResult(resultItems);
                    break;
                    
                case 'Enter':
                    event.preventDefault();
                    if (selectedResultIndex >= 0 && selectedResultIndex < resultItems.length) {
                        const selectedItem = resultItems[selectedResultIndex];
                        const orgName = selectedItem.querySelector('.search-result-name').textContent;
                        selectOrganization(orgName);
                    }
                    break;
                    
                case 'Escape':
                    resultsContainer.style.display = 'none';
                    selectedResultIndex = -1;
                    break;
            }
        }

            resultItems.forEach((item, index) => {
                if (index === selectedResultIndex) {
                    item.style.background = 'rgba(255, 255, 255, 0.1)';

                    item.style.background = '';
                }
            });

        function showFundingAnalytics() {
            console.log('Showing funding analytics with real neighborhoods');
            
            // Aggregate funding by neighborhood
            const neighborhoodFunding = {};
            
            Object.entries(chicagoOrgData).forEach(([orgName, data]) => {
                if (data.neighborhoods) {
                    data.neighborhoods.forEach(neighborhood => {
                        if (!neighborhoodFunding[neighborhood]) {
                            neighborhoodFunding[neighborhood] = 0;
                        }
                        
                        // Parse funding amount
                        const funding = parseInt(data.funding.replace(/[\$,]/g, '')) || 0;
                        neighborhoodFunding[neighborhood] += funding;
                    });
                }
            });
            
            // Show top 10 neighborhoods by funding
            const sortedNeighborhoods = Object.entries(neighborhoodFunding)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);
            
            sortedNeighborhoods.forEach(([neighborhoodName, totalFunding], index) => {
                const cleanName = neighborhoodName.toLowerCase().replace(/[^a-z0-9]/g, '_').replace(/_+/g, '_');
                
                if (neighborhoods[cleanName]) {
                    const coords = neighborhoods[cleanName];
                    
                    // Color intensity based on funding
                    const maxFunding = sortedNeighborhoods[0][1];
                    const intensity = totalFunding / maxFunding;
                    const opacity = 0.3 + (intensity * 0.5);
                    
                    const polygon = L.polygon(coords, {
                        color: '#ffffff',

                        opacity: 0.8,
                        fillColor: '#22c55e',
                        fillOpacity: opacity

                    let popupContent = `
                        <div style="font-family: 'Inter', sans-serif; padding: 12px; min-width: 320px;">
                            <div style="background: rgba(${polygonColor === '#f59e0b' ? '245, 158, 11' : '220, 53, 69'}, 0.2); color: ${badgeColor}; border: 1px solid rgba(${polygonColor === '#f59e0b' ? '245, 158, 11' : '220, 53, 69'}, 0.3); display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; margin-bottom: 8px;">${badgeText}</div>
                            <h3 style="margin: 0 0 12px 0; color: #ffffff; font-size: 16px; font-weight: 600;">${gapData && gapData.recommendation === 'Fund' ? '⭐' : '❌'} ${neighborhoodName}</h3>
                            <div style="font-size: 13px; line-height: 1.5; color: #d4d4d8;">
                                <div style="margin-bottom: 6px;"><strong>📍 Region:</strong> ${region}</div>
                                <div style="margin-bottom: 6px;"><strong>🚫 Knight Impact Partners Presence:</strong> None</div>
                    `;
                    
                    if (gapData && region === 'Chicago') {
                        const recommendationColor = gapData.recommendation === 'Fund' ? '#10b981' : '#ef4444';
                        const recommendationIcon = gapData.recommendation === 'Fund' ? '✅' : '❌';
                        
                        popupContent += `
                                <div style="margin: 12px 0; padding: 8px; background: rgba(255,255,255,0.05); border-radius: 6px;">
                                    <div style="margin-bottom: 6px;"><strong>💰 Median Income:</strong> ${gapData.medianIncome}</div>
                                    <div style="margin-bottom: 6px;"><strong>📊 Citywide Baseline:</strong> $75,134</div>
                                    <div style="margin-bottom: 6px; color: ${recommendationColor}; font-weight: bold;">
                                        ${recommendationIcon} <strong>Recommendation:</strong> ${gapData.recommendation}
                                    </div>
                                    <div style="font-size: 12px; color: #9ca3af; font-style: italic;">
                                        ${gapData.reason}
                                    </div>
                                </div>
                        `;
                    } else {
                        popupContent += `
                                <div style="margin-bottom: 6px;"><strong>💡 Opportunity:</strong> Potential expansion area</div>
                                <div style="margin-bottom: 6px;"><strong>📊 Status:</strong> No current foundation support</div>
                        `;
                    }
                    
                    popupContent += `
                            </div>
                        </div>
                    `;
                    
                    polygon.bindPopup(popupContent);
                    
                    // Add enhanced hover tooltip
                    if (gapData && region === 'Chicago') {
                        const tooltipText = `${neighborhoodName}<br/>Income: ${gapData.medianIncome}<br/>${gapData.recommendation === 'Fund' ? '✅ Recommended' : '❌ Not Recommended'}`;
                        polygon.bindTooltip(tooltipText, {
                            permanent: false,
                            direction: 'top',
                            className: 'custom-tooltip',
                            opacity: 0.9
                        });
                    } else {
                        polygon.bindTooltip(`${neighborhoodName}<br/>Service Gap`, {
                            permanent: false,
                            direction: 'top',
                            className: 'custom-tooltip',
                            opacity: 0.9
                        });
                    }
                    
                    // Add hover effects - show the same popup on hover
                    polygon.on('mouseover', function(e) {
                        this.setStyle({
                            weight: 5,
                            opacity: 1.0,
                            fillOpacity: fillOpacity + 0.2
                        });
                        this.openPopup();
                    });
                    
                    polygon.on('mouseout', function(e) {
                        this.setStyle({
                            weight: 3,
                            opacity: 0.8,
                            fillOpacity: fillOpacity
                        });
                        this.closePopup();
                    });
                    
                    polygon.on('click', function(e) {
                        // Show sidebar with organizations that could potentially serve this gap area
                        showServiceGapExpansionCandidates(neighborhoodName, region);
                    });
                    
                    currentPolygons.push(polygon);
                }
            });
            
            console.log(`Displayed ${currentPolygons.length} service gap areas`);
            
            // Sidebar will show when user clicks on a service gap area
        }
        
        function showUnmappedOrganizations() {
            console.log('Showing organizations without geographic mapping');
            
            // Clear map and previous analytics first
            clearMap();
            
            // Remove active state from all buttons first
            document.querySelectorAll('.analytics-button').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Find organizations without neighborhood data
            const unmappedOrgs = [];
            Object.entries(chicagoOrgData).forEach(([orgName, data]) => {
                // Skip if organization has neighborhoods mapped
                if (!data.neighborhoods || data.neighborhoods.length === 0 || 
                    data.neighborhoods.includes('Other Communities') || 
                    data.neighborhoods.includes('Chicago Metropolitan Area') ||
                    data.neighborhoods.includes('Citywide Service')) {
                    unmappedOrgs.push({
                        name: orgName,
                        focus: data.focus,
                        funding: data.funding,
                        students: data.students
                    });
                }
            });
            
            console.log(`Found ${unmappedOrgs.length} unmapped organizations:`, unmappedOrgs);
            
            // Update sidebar content
            document.getElementById('sidebarTitle').textContent = "Unmapped Organizations";
            document.getElementById('sidebarSectionLabel').textContent = "Organizations Without Geographic Data";
            
            // Populate right sidebar with unmapped organizations
            const sidebarList = document.getElementById('sidebarOrgsList');
            if (unmappedOrgs.length === 0) {
                sidebarList.innerHTML = `
                    <div style="text-align: center; color: #71717a; font-style: italic; padding: 20px;">
                        All organizations have specific neighborhood mappings
                    </div>
                `;
            } else {
                sidebarList.innerHTML = unmappedOrgs.map(org => {
                    const categoryClass = org.focus.toLowerCase().replace(/[^a-z]/g, '-');
                    return `
                        <div class="unmapped-org-card">
                            <div class="category-badge ${categoryClass}" style="margin-bottom: 8px;">${org.focus}</div>
                            <h4 style="margin: 0 0 8px 0; color: #ffffff; font-size: 14px; font-weight: 600;">${org.name}</h4>
                            <div style="font-size: 12px; line-height: 1.4; color: #d4d4d8;">
                                <div style="margin-bottom: 4px;"><strong>💰 Funding:</strong> ${org.funding}</div>
                                <div style="margin-bottom: 4px;"><strong>👥 People Impacted:</strong> ${org.students}</div>
                                <div style="color: #f59e0b;"><strong>📍 Status:</strong> No specific neighborhood mapping</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            
            // Show right sidebar
            showRightSidebar();
            
            // Set button as active
            event.target.classList.add('active');
        }
        
        function showRightSidebar() {
            const container = document.querySelector('.container');
            container.classList.add('with-right-sidebar');
        }
        
        function hideRightSidebar() {
            const container = document.querySelector('.container');
            container.classList.remove('with-right-sidebar');
        }
        
        function toggleRightSidebar() {
            const container = document.querySelector('.container');
            if (container.classList.contains('with-right-sidebar')) {
                hideRightSidebar();
            } else {
                showRightSidebar();
            }
        }
        
        function showServiceGapExpansionCandidates(gapNeighborhood, gapRegion) {
            // Find organizations that could potentially expand to this gap area
            const expansionCandidates = [];
            
            Object.entries(chicagoOrgData).forEach(([orgName, data]) => {
                if (data.neighborhoods && data.neighborhoods.length > 0) {
                    // Include organizations that serve multiple areas (more likely to expand)
                    if (data.neighborhoods.length >= 2) {
                        expansionCandidates.push({
                            name: orgName,
                            category: data.focus,
                            funding: data.funding,
                            people: data.students,
                            neighborhoods: data.neighborhoods
                        });
                    }
                }
            });
            
            // Sort by number of areas served (most versatile organizations first)
            expansionCandidates.sort((a, b) => b.neighborhoods.length - a.neighborhoods.length);
            
            // Update sidebar content
            document.getElementById('sidebarTitle').textContent = "Service Gap Analysis";
            document.getElementById('sidebarSectionLabel').textContent = `Expansion Candidates for ${gapNeighborhood} (${gapRegion || 'Unknown'})`;
            
            const sidebarList = document.getElementById('sidebarOrgsList');
            
            if (expansionCandidates.length === 0) {
                sidebarList.innerHTML = `
                    <div style="text-align: center; color: #71717a; font-style: italic; padding: 20px;">
                        No expansion candidates identified
                    </div>
                `;
            } else {
                sidebarList.innerHTML = expansionCandidates.slice(0, 10).map(org => {
                    const categoryClass = org.category.toLowerCase().replace(/[^a-z]/g, '-');
                    return `
                        <div class="unmapped-org-card" onclick="selectOrganization('${org.name}')" style="cursor: pointer;">
                            <div class="category-badge ${categoryClass}" style="margin-bottom: 8px;">${org.category}</div>
                            <h4 style="margin: 0 0 8px 0; color: #ffffff; font-size: 14px; font-weight: 600;">${org.name}</h4>
                            <div style="font-size: 12px; line-height: 1.4; color: #d4d4d8;">
                                <div style="margin-bottom: 4px;"><strong>💰 Funding:</strong> ${org.funding}</div>
                                <div style="margin-bottom: 4px;"><strong>👥 People Impacted:</strong> ${org.people}</div>
                                <div style="margin-bottom: 4px;"><strong>📍 Current Areas:</strong> ${org.neighborhoods.slice(0, 3).join(', ')}${org.neighborhoods.length > 3 ? '...' : ''}</div>
                                <div style="color: #10b981;"><strong>💡 Expansion Potential:</strong> Serves ${org.neighborhoods.length} areas</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            
            // Show sidebar
            showRightSidebar();
        }
        
        function populateSidebarWithNeighborhoodOrgs(neighborhoods, title, sectionLabel) {
            // Find all organizations serving these neighborhoods
            const orgsInNeighborhoods = [];
            
            Object.entries(chicagoOrgData).forEach(([orgName, data]) => {
                if (data.neighborhoods) {
                    const hasMatchingNeighborhood = data.neighborhoods.some(neighborhood => 
                        neighborhoods.includes(neighborhood)
                    );
                    
                    if (hasMatchingNeighborhood) {
                        const matchingNeighborhoods = data.neighborhoods.filter(n => neighborhoods.includes(n));
                        orgsInNeighborhoods.push({
                            name: orgName,
                            category: data.focus,
                            funding: data.funding,
                            people: data.students,
                            neighborhoods: matchingNeighborhoods
                        });
                    }
                }
            });
            
            // Sort by funding amount (highest first)
            orgsInNeighborhoods.sort((a, b) => {
                const aFunding = parseInt(a.funding.replace(/[\$,]/g, '')) || 0;
                const bFunding = parseInt(b.funding.replace(/[\$,]/g, '')) || 0;
                return bFunding - aFunding;
            });
            
            // Update sidebar content
            document.getElementById('sidebarTitle').textContent = title;
            document.getElementById('sidebarSectionLabel').textContent = sectionLabel;
            
            const sidebarList = document.getElementById('sidebarOrgsList');
            
            if (orgsInNeighborhoods.length === 0) {
                sidebarList.innerHTML = `
                    <div style="text-align: center; color: #71717a; font-style: italic; padding: 20px;">
                        No organizations found in selected areas
                    </div>
                `;
            } else {
                sidebarList.innerHTML = orgsInNeighborhoods.map(org => {
                    const categoryClass = org.category.toLowerCase().replace(/[^a-z]/g, '-');
                    return `
                        <div class="unmapped-org-card" onclick="selectOrganization('${org.name}')" style="cursor: pointer;">
                            <div class="category-badge ${categoryClass}" style="margin-bottom: 8px;">${org.category}</div>
                            <h4 style="margin: 0 0 8px 0; color: #ffffff; font-size: 14px; font-weight: 600;">${org.name}</h4>
                            <div style="font-size: 12px; line-height: 1.4; color: #d4d4d8;">
                                <div style="margin-bottom: 4px;"><strong>💰 Funding:</strong> ${org.funding}</div>
                                <div style="margin-bottom: 4px;"><strong>👥 People Impacted:</strong> ${org.people}</div>
                                <div style="margin-bottom: 4px;"><strong>📍 Areas:</strong> ${org.neighborhoods.join(', ')}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            
            // Show sidebar
            showRightSidebar();
            
            console.log(`Found ${orgsInNeighborhoods.length} organizations in selected areas:`, orgsInNeighborhoods);
        }
        
        function clearAnalytics() {
            clearMap();
            hideRightSidebar(); // Close right sidebar
            document.querySelectorAll('.analytics-button').forEach(btn => {
                btn.classList.remove('active');
            });
        }
        
        function clearMap() {
            currentPolygons.forEach(polygon => {
                map.removeLayer(polygon);
            });
            currentPolygons = [];
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            populateOrganizationSelector();
            console.log('🗺️ Enhanced Map with Real Neighborhoods initialized');
            console.log('📊 Corrected metrics: $8.98M funding, 278K people, 83 orgs');
        });
    </script>
</body>
</html>
